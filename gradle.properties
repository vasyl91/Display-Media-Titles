# Project-wide Gradle settings.
# Settings configured through the IDE override the values in this file.
# https://docs.gradle.org/current/userguide/build_environment.html

# JVM arguments for the Gradle daemon (AGP 9 + R8 full mode need more than 2 GB with several flavors).
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Build independent tasks in parallel and reuse outputs from previous builds.
org.gradle.parallel=true
org.gradle.caching=true

# AGP 9, KGP, KSP and the dependency-analysis plugin support the configuration cache.
# Enable it after the first successful build to speed up configuration:
#org.gradle.configuration-cache=true

# Kotlin code style for this project: "official" or "obsolete".
kotlin.code.style=official

# Show every Gradle deprecation warning.
org.gradle.warning.mode=all

# android.useAndroidX=true and android.nonTransitiveRClass=true are the defaults in AGP 9,
# so they are no longer declared here.

# Optional dedicated signing key for the "phone" flavor. Put these into ~/.gradle/gradle.properties
# (never commit them). Without them the phone flavor is signed with the platform key.
#phoneStoreFile=/absolute/path/to/phone.jks
#phoneStorePassword=
#phoneKeyAlias=
#phoneKeyPassword=

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
