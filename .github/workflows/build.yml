# Builds the app and runs the JVM unit tests on every push and pull request, so a change that does
# not compile is caught right away rather than in Android Studio.
name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # The Gradle daemon asks for the JVM named in gradle/gradle-daemon-jvm.properties (25).
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also asks for the long-removed "tools" package, which current
          # cmdline-tools no longer find, failing the step.
          packages: "platform-tools"

      - name: Install the compile SDK
        run: |
          # app/build.gradle.kts declares it as compileSdk { version = release(NN) }.
          sdk=$(grep -oP 'release\(\K[0-9]+' app/build.gradle.kts | head -n 1)
          yes 2>/dev/null | sdkmanager --licenses > /dev/null || true
          # Newer platforms carry a minor version in the package name (android-37.0, android-36.1):
          # take the exact name if it exists, else the newest android-<sdk>.<n>.
          pkg=$(sdkmanager --list 2>/dev/null \
            | grep -oP "^\s*\Kplatforms;android-${sdk}(\.[0-9]+)?(?=\s)" \
            | sort -uV | awk -v exact="platforms;android-${sdk}" '$0 == exact { e = $0 } { last = $0 } END { print (e != "" ? e : last) }')
          if [ -z "$pkg" ]; then
            echo "::warning::No SDK platform package found for compileSdk ${sdk}; leaving it to Gradle"
            exit 0
          fi
          echo "Installing ${pkg}"
          sdkmanager "${pkg}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: bash ./gradlew :app:testVasylTitlesDebugUnitTest --stacktrace

      - name: Build (system flavor, debug)
        run: bash ./gradlew :app:assembleVasylTitlesDebug --stacktrace

      - name: Build (phone flavor, debug)
        run: bash ./gradlew :app:assemblePhoneDebug --stacktrace

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: warn
